<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Comparison Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Book Comparison Platform</h1>
  <p>Search for a book and compare its editions</p>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search for a book...">
    <button id="searchButton">Search</button>
  </div>

  <div class="section-header">
    <h2>From Google Books</h2>
    <select id="googleSort">
      <option value="none">Sort by...</option>
      <option value="title">Title (A-Z)</option>
      <option value="pages">Page Count</option>
    </select>
    <input type="text" id="googleFilter" placeholder="Filter by category...">
  </div>
  <div id="googleResults" class="results"></div>

  <div class="section-header">
    <h2>From Open Library</h2>
    <select id="openLibrarySort">
      <option value="none">Sort by...</option>
      <option value="title">Title (A-Z)</option>
      <option value="editions">Edition Count</option>
    </select>
    <input type="text" id="openLibraryFilter" placeholder="Filter by language (e.g. eng)...">
  </div>
  <div id="openLibraryResults" class="results"></div>

  <script src="script.js"></script>
</body>
</html>
